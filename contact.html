<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VitB Company — Contact</title>
<meta name="description" content="VitB Company — industrial montage in Romania: equipment installation, steel structures, pipelines, production lines, dismantling, relocation and maintenance." />
<link rel="stylesheet" href="styles.css?v=7" />
</head>
<body>
<div class="page">
  <div class="grid-bg" aria-hidden="true"></div>
  <header class="header">
    <div class="hazard"></div>
    <div class="header-in">
      <a class="brand" href="index.html?v=7" aria-label="VitB Company"><svg viewBox="0 0 40 40" aria-hidden="true"><polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="#2f343a" stroke="#ff6a1a" stroke-width="2.5"/><circle cx="20" cy="20" r="7" fill="#16181b" stroke="#e6e8ea" stroke-width="2.5"/></svg><span>VIT<b>B</b> COMPANY</span></a>
      <div class="header-right">
        <div class="lang-switch" role="group" aria-label="Language"><button type="button" class="lang-btn active" data-lang="en" title="English" aria-label="English" aria-pressed="true" onclick="return window.__setLang && window.__setLang('en')"><img src="assets/flags/en.svg" alt="EN" /></button><button type="button" class="lang-btn" data-lang="ro" title="Română" aria-label="Română" aria-pressed="false" onclick="return window.__setLang && window.__setLang('ro')"><img src="assets/flags/ro.svg" alt="RO" /></button><button type="button" class="lang-btn" data-lang="de" title="Deutsch" aria-label="Deutsch" aria-pressed="false" onclick="return window.__setLang && window.__setLang('de')"><img src="assets/flags/de.svg" alt="DE" /></button><button type="button" class="lang-btn" data-lang="ru" title="Русский" aria-label="Русский" aria-pressed="false" onclick="return window.__setLang && window.__setLang('ru')"><img src="assets/flags/ru.svg" alt="RU" /></button></div>
        <nav class="nav"><ul><li><a href="index.html?v=7"><span data-i18n="nav_home">Home</span></a></li><li><a href="services.html?v=7"><span data-i18n="nav_services">Services</span></a></li><li><a href="about.html?v=7"><span data-i18n="nav_about">About</span></a></li><li><a class="active" href="contact.html?v=7"><span data-i18n="nav_contact">Contact</span></a></li></ul></nav>
      </div>
    </div>
  </header>
  <main class="main">
    <div class="eyebrow fade">VitB Company</div>
    <h1 class="page-title fade d1" data-i18n="page_contact">CONTACT</h1>
    <p class="lead fade d2" data-i18n="contact_intro">Tell us about your project and we will get back to you.</p>
    <div class="contact-grid">
      <form class="form fade d3" onsubmit="return false;">
        <div class="field"><label for="f-name" data-i18n="form_name">Name</label><input id="f-name" name="name" type="text" autocomplete="name" /></div>
        <div class="field"><label for="f-company" data-i18n="form_company">Company</label><input id="f-company" name="company" type="text" autocomplete="organization" /></div>
        <div class="field"><label for="f-phone" data-i18n="form_phone">Phone</label><input id="f-phone" name="phone" type="tel" autocomplete="tel" /></div>
        <div class="field"><label for="f-email" data-i18n="form_email">Email</label><input id="f-email" name="email" type="email" autocomplete="email" /></div>
        <div class="field full"><label for="f-service" data-i18n="form_service">Service type</label><select id="f-service" name="service"><option value="" data-i18n="form_choose">Select a service</option><option value="s1" data-i18n="s1_t">Equipment installation</option><option value="s2" data-i18n="s2_t">Steel structures</option><option value="s3" data-i18n="s3_t">Pipelines</option><option value="s4" data-i18n="s4_t">Production lines</option><option value="s5" data-i18n="s5_t">Dismantling & relocation</option><option value="s6" data-i18n="s6_t">Maintenance</option><option value="other" data-i18n="form_other">Other</option></select></div>
        <div class="field full"><label for="f-desc" data-i18n="form_desc">Project description</label><textarea id="f-desc" name="description"></textarea></div>
        <button class="btn btn-solid" type="submit" data-i18n="form_submit">Send request</button>
      </form>
      <aside class="info fade d4">
        <div class="hazard"></div>
        <div class="row"><span data-i18n="label_email">Email</span><strong>—</strong></div>
        <div class="row"><span data-i18n="label_phone">Phone</span><strong>—</strong></div>
        <div class="row"><span data-i18n="label_location">Location</span><strong data-i18n="value_location">Romania</strong></div>
        <p data-i18n="contact_note">Include the type of work, the site location and the desired timeframe.</p>
      </aside>
    </div>
  </main>
  <footer class="footer"><div class="footer-in"><span>© VitB Company</span><span data-i18n="footer_tag">Industrial montage ◆ Romania</span><span>Romania</span></div></footer>
</div>
<script>
  window.__setLang = function (lang) {
    try {
      if (window.__vitbApply) { window.__vitbApply(lang); return false; }
      localStorage.setItem('vitbcompany-lang', lang);
      location.reload();
    } catch (e) { location.reload(); }
    return false;
  };
</script>
<script src="assets/i18n.js?v=7" defer></script>
</body>
</html>
